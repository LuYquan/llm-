<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>场景路线 · 合成交互验证</title>
<style>body{margin:0;font:14px/1.6 system-ui,sans-serif}header{padding:12px 20px;border-bottom:1px solid var(--border-subtle)}h1{font-size:18px;margin:0}p{margin:6px 0}.fixture-controls{display:flex;flex-wrap:wrap;gap:8px}button{font:inherit;padding:7px 12px;border:1px solid var(--border-strong);border-radius:5px;color:var(--text-main);background:var(--bg-elevated);cursor:pointer}.fixture-layout{display:grid;grid-template-columns:490px minmax(0,1fr);height:calc(100vh - 140px);min-height:540px}#component-host{min-height:0;border-right:1px solid var(--border-subtle)}aside{overflow:auto;padding:16px 20px}pre{font:12px/1.5 var(--font-mono);white-space:pre-wrap;overflow-wrap:anywhere}#fixture-status{color:var(--accent-terracotta)}@media(max-width:800px){.fixture-layout{grid-template-columns:1fr;height:auto}#component-host{height:750px}}</style></head>
<body><header><h1>场景路线 · 实际调参组件</h1><p>独立 localhost 合成遥测与本地 HTTP 响应。无原生串口、无硬件、无外部 AI。</p><div class="fixture-controls"><label>合成案例 <select id="fixture-case"><option value="offline">离线模型 · 无设备配置</option><option value="valid">有效单次阶跃</option><option value="legacy">旧阶跃配置 · 缺容差</option><option value="repeated">多次目标跳变</option><option value="ramp">设定值斜坡</option><option value="unsettled">阶跃前反馈未稳定</option><option value="output">错误阶跃含越界输出</option><option value="track">重复目标 · 跟踪路线</option></select></label><button id="prepare">载入合成配置</button><button id="window">补充合成窗口</button><button id="capture">记录当前证据</button></div></header>
<div class="fixture-layout"><main id="component-host"></main><aside><p id="fixture-status">正在准备</p><p>先在实际组件核对基线，再补充窗口、请求候选。只有有效窗口才应打开 AI 摘要确认；候选始终不发送。</p><pre id="proof-json">{}</pre></aside></div><script type="module" src="./scenario-flow-harness.ts"></script></body></html>
